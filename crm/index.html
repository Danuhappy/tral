<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Кентавр CRM</title>
<meta name="theme-color" content="#F2F5F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1413" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Кентавр">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<script src="../den/config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap">
<style>html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Layout: dispatcher's console — top bar with tabs on wide screens, bottom tabs on phone; cards on a grid; teal marks money and progress, amber/red only for attention */
:root{
  --bg:#F2F5F4; --surface:#FFFFFF; --surface2:#F6F8F7; --sunk:#E8EDEB; --ink:#12201E; --muted:#5B6B68; --faint:#8E9C99; --line:#DCE3E1;
  --accent:#127C74; --accent-ink:#FFFFFF; --soft:#DCEFEC; --ok:#1E8A55; --warn:#B7790A; --warn-soft:#FBEFD5; --danger:#C2412D; --danger-soft:#FBE3DE;
  --st1:#B9DDD8; --st2:#8CC7C0; --st3:#5EAFA6; --st4:#35938A; --st5:#1D7870; --st6:#0E5A53;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#e87ba4;
  --font:"Onest", -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:16px; --h:46px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1413; --surface:#141E1D; --surface2:#182423; --sunk:#1E2B2A; --ink:#E5EEEC; --muted:#93A5A1; --faint:#677874; --line:#233230;
  --accent:#45B3A8; --accent-ink:#06201D; --soft:#173634; --ok:#4CC08A; --warn:#E3A93B; --warn-soft:#3A2C12; --danger:#F07A66; --danger-soft:#3D1F1A;
  --st1:#1E4642; --st2:#25605A; --st3:#2D7B73; --st4:#3A978D; --st5:#55B2A8; --st6:#86CCC4;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#d55181;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0D1413; --surface:#141E1D; --surface2:#182423; --sunk:#1E2B2A; --ink:#E5EEEC; --muted:#93A5A1; --faint:#677874; --line:#233230;
  --accent:#45B3A8; --accent-ink:#06201D; --soft:#173634; --ok:#4CC08A; --warn:#E3A93B; --warn-soft:#3A2C12; --danger:#F07A66; --danger-soft:#3D1F1A;
  --st1:#1E4642; --st2:#25605A; --st3:#2D7B73; --st4:#3A978D; --st5:#55B2A8; --st6:#86CCC4;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#d55181;
  color-scheme:dark }

*,*::before,*::after{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit;margin:0}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .in{max-width:1240px;margin:0 auto;padding-inline:16px;height:56px;display:flex;align-items:center;gap:14px}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:16px;letter-spacing:-.01em;white-space:nowrap}
.logo i{width:28px;height:28px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-style:normal;font-size:14px;font-weight:800}
.nav{display:none;gap:4px;margin-left:8px}
.nav button{border:1px solid transparent;background:none;border-radius:10px;padding:7px 12px;font-weight:600;font-size:14px;color:var(--muted);display:flex;gap:7px;align-items:center}
.nav button svg{width:16px;height:16px}
.nav button[aria-current="page"]{background:var(--surface);border-color:var(--line);color:var(--ink)}
.nav .cnt{font-size:11px;font-weight:700;background:var(--soft);color:var(--accent);border-radius:6px;padding:0 6px}
.top .sp{flex:1}
.ibtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:38px;height:38px;display:grid;place-items:center;padding:0;color:var(--ink);flex:none}
.ibtn svg{width:18px;height:18px}
.addbtn{border:0;background:var(--accent);color:var(--accent-ink);border-radius:10px;height:38px;padding:0 14px;font-weight:700;display:flex;align-items:center;gap:6px;white-space:nowrap}
.addbtn svg{width:16px;height:16px}

.wrap{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:18px calc(96px + env(safe-area-inset-bottom,0px))}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700}
h1{font-size:26px;line-height:1.15;margin:4px 0 2px;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
.lead{color:var(--muted);margin:0}
.vhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}

/* cards */
.grid{display:grid;gap:12px;grid-template-columns:1fr}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card.hero{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 22%,var(--surface)) 0%,var(--surface) 70%)}
.ct{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.ct h3{margin:0;font-size:14px;font-weight:700}
.ct .link{background:none;border:0;color:var(--accent);font-weight:600;font-size:13px;padding:0}
.sub{color:var(--muted);font-size:13px}
.big{font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.delta{font-size:13px;font-weight:700}
.delta.up{color:var(--ok)}.delta.down{color:var(--danger)}
.prog{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden;margin:14px 0 6px}
.prog i{display:block;height:100%;background:var(--accent);border-radius:99px}
.minis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.mini{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:9px 10px;min-width:0}
.mini span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini b{font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap}
.stack{display:flex;height:12px;border-radius:99px;overflow:hidden;gap:2px;margin:12px 0}
.stack i{display:block;min-width:4px}
.legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px;font-size:13px}
.legend div{display:flex;align-items:center;gap:7px;min-width:0}
.legend i{width:9px;height:9px;border-radius:3px;flex:none}
.legend span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.legend b{font-variant-numeric:tabular-nums;font-weight:600}

/* week bars */
.wbars{display:flex;align-items:flex-end;gap:8px;height:130px;margin-top:8px}
.wbars .wb{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0;background:none;border:0;padding:0;color:inherit}
.wbars .bar{width:100%;max-width:38px;background:var(--st3);border-radius:6px 6px 2px 2px;min-height:3px;position:relative}
.wbars .wb.today .bar{background:var(--accent)}
.wbars .wb.future .bar{background:repeating-linear-gradient(135deg,var(--sunk) 0 4px,transparent 4px 8px);border:1px dashed var(--line)}
.wbars .lbl{font-size:12px;color:var(--muted)}
.wbars .wb.today .lbl{color:var(--ink);font-weight:800}
.wbars .tip{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:11px;font-weight:700;border-radius:6px;padding:2px 6px;white-space:nowrap}

/* lists */
.rows{display:grid;gap:6px;list-style:none;margin:0;padding:0}
.row{display:flex;gap:11px;align-items:center;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:9px 11px;min-width:0;text-align:left;width:100%;color:inherit}
button.row{cursor:pointer}
.av{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none;background:var(--soft);color:var(--accent)}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .t span{display:block;font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.row .v small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;border-radius:99px;padding:2px 8px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--danger-soft);color:var(--danger)}
.pill.acc{background:var(--soft);color:var(--accent)}
.att{border-left:3px solid var(--warn)}
.att.bad{border-left-color:var(--danger)}
.trucks{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.truck{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:7px 6px;text-align:center;min-width:0}
.truck b{display:block;font-size:13px}
.truck span{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.truck.go{background:var(--soft);border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.truck.go span{color:var(--accent);font-weight:700}
.truck.wait span{color:var(--warn);font-weight:700}
.next{display:grid;gap:8px}
.next .when{font-size:12px;color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.next b{font-size:17px}

/* pipeline */
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.chips::-webkit-scrollbar{display:none}
.chip{height:34px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:0 13px;font-size:13px;font-weight:600;white-space:nowrap;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search{position:relative;flex:1 1 200px;min-width:0;max-width:340px}
.search input{width:100%;height:38px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 12px 0 34px;font-size:16px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--faint)}
.board{display:flex;gap:10px;overflow-x:auto;padding-bottom:10px;margin-inline:-16px;padding-inline:16px;scroll-snap-type:x proximity;align-items:flex-start;overscroll-behavior-x:contain}
.col{flex:0 0 min(78vw,272px);scroll-snap-align:start;background:var(--surface2);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:140px;transition:border-color .12s,background .12s}
.col.over{border-color:var(--accent);background:var(--soft)}
.colh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:2px 2px 0}
.colh b{display:flex;gap:7px;align-items:center;font-size:14px}
.colh b i{width:8px;height:8px;border-radius:50%}
.colh .n{font-size:12px;font-weight:700;color:var(--muted);background:var(--sunk);border-radius:6px;padding:0 6px}
.colsum{font-size:12.5px;color:var(--muted);padding:0 2px;font-variant-numeric:tabular-nums}
.colbar{height:3px;border-radius:99px;margin:0 2px 2px}
.lcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 11px;display:grid;gap:6px;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:pan-x pan-y;text-align:left;width:100%;color:inherit}
.lcard .cl{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;min-width:0}
.lcard .cl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lcard .rt{font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.lcard .mn{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.lcard .mn b{font-size:18px;font-variant-numeric:tabular-nums}
.lcard .ft{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.lcard.dragging{opacity:.35}
.dragghost{position:fixed;z-index:60;pointer-events:none;width:250px;transform:rotate(2deg);box-shadow:0 18px 40px rgba(0,0,0,.28);cursor:grabbing}
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:16px;text-align:center;font-size:12.5px;color:var(--faint)}
.rpk{font-size:12px;font-weight:800;border-radius:6px;padding:1px 6px;font-variant-numeric:tabular-nums}
.rpk.g{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.rpk.m{background:var(--sunk);color:var(--muted)}
.rpk.b{background:var(--danger-soft);color:var(--danger)}

/* clients table */
.tbl{display:grid;gap:6px}
.crow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 11px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;width:100%;color:inherit}
.crow .nm b{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow .nm span{display:block;font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow .rt{text-align:right;font-variant-numeric:tabular-nums}
.crow .rt b{display:block}
.crow .rt span{font-size:12px;color:var(--muted)}

/* reports */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.kpi span{font-size:12.5px;color:var(--muted)}
.kpi b{display:block;font-size:24px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin:2px 0}
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;overflow:visible}
.ctip{position:absolute;top:0;background:var(--ink);color:var(--bg);border-radius:8px;padding:6px 9px;font-size:12px;pointer-events:none;white-space:nowrap;transform:translateX(-50%)}
.ctip b{font-variant-numeric:tabular-nums}
.key{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.key span{display:flex;gap:6px;align-items:center}
.key i{width:16px;height:0;border-top:2px solid var(--accent)}
.key i.d{border-top:2px dashed var(--faint)}
.funnel{display:grid;gap:9px}
.fn{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;align-items:center;font-size:13px}
.fn small{display:block;color:var(--muted);font-size:11.5px}
.fn .tr{height:22px;background:var(--sunk);border-radius:6px;overflow:hidden}
.fn .tr i{display:block;height:100%;border-radius:6px;background:var(--st4)}
.donut{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.donut svg{width:140px;height:140px;flex:none}
.lb{display:grid;gap:10px}
.lb .it{display:grid;grid-template-columns:22px 30px minmax(0,1fr) auto;gap:10px;align-items:center}
.lb .it .pos{color:var(--faint);font-weight:700;text-align:center}
.lb .it .nm b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb .it .nm span{font-size:12px;color:var(--muted)}
.lb .it .tr{grid-column:3/-1;height:4px;background:var(--sunk);border-radius:99px;overflow:hidden;margin-top:-4px}
.lb .it .tr i{display:block;height:100%;background:var(--accent)}
.seg{display:inline-flex;background:var(--sunk);border-radius:10px;padding:3px;gap:2px}
.seg button{height:30px;border:0;background:transparent;padding:0 12px;border-radius:8px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,12,11,.45);z-index:40;opacity:0;transition:opacity .2s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:20px 20px 0 0;max-height:92vh;overflow-y:auto;overscroll-behavior:contain;padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .25s ease}
.sheet.on{transform:none}
.grab{width:40px;height:5px;border-radius:99px;background:var(--line);margin:4px auto 10px}
.sh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px}
.sh h2{margin:0;font-size:20px;font-weight:800;letter-spacing:-.01em;overflow-wrap:anywhere}
.form{display:grid;gap:10px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fl{display:grid;gap:4px;min-width:0}
.fl>span{font-size:12px;font-weight:700;color:var(--muted)}
.field{width:100%;min-width:0;height:var(--h);border:1px solid var(--line);background:var(--surface2);border-radius:11px;padding:0 12px;font-size:16px;-webkit-appearance:none;appearance:none}
textarea.field{height:auto;min-height:70px;padding:10px 12px;resize:vertical}
select.field{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) 20px,calc(100% - 12px) 20px;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
input[type="date"].field{display:flex;align-items:center}
.field::-webkit-date-and-time-value{text-align:left}
.field:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.verdict{border-radius:12px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px}
.verdict b{font-size:20px;font-variant-numeric:tabular-nums}
.verdict.g{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.verdict.m{background:var(--sunk);color:var(--muted)}
.verdict.b{background:var(--danger-soft);color:var(--danger)}
.stages{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none}
.stages button{flex:none;height:34px;border:1px solid var(--line);background:var(--surface2);border-radius:9px;padding:0 10px;font-size:13px;font-weight:600;color:var(--muted)}
.stages button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn{height:var(--h);border:0;border-radius:11px;padding:0 16px;font-weight:700;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;text-decoration:none;font-size:15px}
.btn svg{width:17px;height:17px}
.btn.ghost{background:var(--sunk);color:var(--ink)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.tile span{font-size:12px;color:var(--muted)}
.tile b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.sec{font-size:13px;font-weight:800;margin:16px 0 8px}
.tl{display:grid;gap:12px;list-style:none;margin:0;padding:0 0 0 4px}
.tl li{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:10px;align-items:start}
.tl li i{width:10px;height:10px;border-radius:50%;border:2px solid var(--accent);margin-top:5px}
.tl li b{display:block;font-weight:600;overflow-wrap:anywhere}
.tl li span{font-size:12px;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:26px 14px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.empty .btn{margin-top:12px}
.note{font-size:13px;color:var(--muted);background:var(--sunk);border-radius:12px;padding:10px 12px}
.keybox{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--sunk);border-radius:12px;padding:12px 14px;margin:6px 0 8px}
.keybox b{letter-spacing:.04em;overflow-wrap:anywhere}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
.tabbar .in{display:flex;width:100%;max-width:560px}
.tab{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;font-size:11.5px;font-weight:600;color:var(--muted);min-width:0}
.tab svg{width:21px;height:21px}
.tab .ic{display:grid;place-items:center;width:52px;height:28px;border-radius:99px}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] .ic{background:var(--soft);color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;display:flex;gap:16px;align-items:center;font-size:14px;font-weight:600;width:max-content;max-width:calc(100% - 32px);z-index:70;box-shadow:0 8px 28px rgba(0,0,0,.25)}
.toast button{background:none;border:0;color:var(--accent);font-weight:800;padding:0;filter:brightness(1.3)}

@media (min-width:760px){
  .grid.home{grid-template-columns:repeat(6,minmax(0,1fr))}
  .home .s3{grid-column:span 3}.home .s2{grid-column:span 2}.home .s4{grid-column:span 4}.home .s6{grid-column:span 6}
  .kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
  .grid.rep{grid-template-columns:repeat(3,minmax(0,1fr))}
  .rep .s2{grid-column:span 2}
  .crow{grid-template-columns:auto minmax(0,1.4fr) minmax(0,1fr) 110px 120px 110px}
  .sheet{left:auto;top:0;bottom:0;width:440px;max-height:none;border-radius:20px 0 0 20px;transform:translateX(100%);padding-top:18px}
  .grab{display:none}
}
@media (min-width:1000px){
  .nav{display:flex}
  .tabbar{display:none}
  .wrap{padding-bottom:40px}
  .toast{bottom:24px}
  .col{flex:1 0 220px}
  .home .s2l{grid-column:span 2}
}
@media (max-width:759px){
  .crow .hide-m{display:none}
  .legend{grid-template-columns:1fr}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

<header class="top">
  <div class="in">
    <div class="logo"><i>К</i>Кентавр</div>
    <nav class="nav" id="nav" aria-label="Разделы"></nav>
    <div class="sp"></div>
    <button type="button" class="ibtn" id="themeBtn" aria-label="Тема"></button>
    <button type="button" class="ibtn" id="setBtn" aria-label="Настройки"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
    <button type="button" class="addbtn" id="newLoad"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Заявка</button>
  </div>
</header>

<main class="wrap">

  <section id="v-clients" hidden></section>

  <section id="v-settings" hidden></section>
</main>

<nav class="tabbar" aria-label="Разделы"><div class="in" id="tabbar"></div></nav>
<div class="scrim" id="scrim" hidden></div>
<aside class="sheet" id="sheet" hidden role="dialog" aria-modal="true"></aside>
<div class="toast" id="toast" hidden><span id="toastText"></span><button type="button" id="toastBtn" hidden>Вернуть</button></div>

<script>
(function(){
"use strict";
/* =============== helpers =============== */
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseYmd=s=>{if(!s)return null;const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const today=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())};
const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const daysBetween=(a,b)=>Math.round((b-a)/864e5);
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const nf=new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0});
const rub=n=>nf.format(Math.round(n||0))+' ₽';
const krub=n=>{n=n||0;if(Math.abs(n)>=1e6)return nf.format(+(n/1e6).toFixed(n>=1e7?1:2)).replace('.',',')+' млн ₽';if(Math.abs(n)>=1e3)return nf.format(Math.round(n/1e3))+' тыс ₽';return nf.format(n)+' ₽'};
const fDay=new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'short'});
const fDayW=new Intl.DateTimeFormat('ru-RU',{weekday:'long',day:'numeric',month:'long'});
const fMonth=new Intl.DateTimeFormat('ru-RU',{month:'long'});
const fMonY=new Intl.DateTimeFormat('ru-RU',{month:'short'});
const cap=s=>s?s[0].toUpperCase()+s.slice(1):s;
function plural(n,f){const a=Math.abs(n)%100,b=a%10;return a>10&&a<20?f[2]:b===1?f[0]:b>=2&&b<=4?f[1]:f[2]}
function h(tag,attrs,...kids){const e=document.createElement(tag);if(attrs)for(const k in attrs){const v=attrs[k];if(v==null||v===false)continue;if(k==='class')e.className=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(k==='style')e.style.cssText=v;else if(k==='html')e.innerHTML=v;else e.setAttribute(k,v===true?'':v)}for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(String(c)))}return e}
function lsGet(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
const I={
 home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg>',
 pipe:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="11" rx="1.5"/><rect x="17" y="4" width="4" height="7" rx="1.5"/></svg>',
 clients:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c1.9.7 3 2.5 3.5 5.2"/></svg>',
 reports:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18M5 16l4.5-5 3.5 3 6-7"/></svg>',
 sun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
 moon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>',
 auto:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17A8.5 8.5 0 0 0 12 3.5z" fill="currentColor"/></svg>',
 phone:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>',
 msg:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H8l-4 4z"/></svg>',
 plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
 x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
 search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>'};
const icon=n=>{const s=document.createElement('span');s.innerHTML=I[n];return s.firstChild};

/* =============== domain =============== */
const STAGES=[['found','Найден груз'],['talk','Торг'],['ok','Подтверждён'],['road','В пути'],['done','Выгружен'],['paid','Оплачен'],['lost','Сорвался']];
const ACTIVE=['found','talk','ok','road','done'];
const stName=id=>(STAGES.find(s=>s[0]===id)||STAGES[0])[1];
const stIdx=id=>STAGES.findIndex(s=>s[0]===id);
const stColor=id=>({found:'var(--st1)',talk:'var(--st2)',ok:'var(--st3)',road:'var(--st4)',done:'var(--st5)',paid:'var(--st6)',lost:'var(--faint)'})[id];
const SOURCES=[['ati','АТИ','var(--c1)'],['regular','Постоянный','var(--c3)'],['call','Звонок','var(--c2)'],['other','Другое','var(--c4)']];
const DEF_SET={name:'Данил',goal:2500000,minRate:110,targetRate:130,trucks:10,payDays:14};
const state={loads:[],clients:[],settings:Object.assign({},DEF_SET),ready:false};
const set=()=>state.settings;
const perKm=l=>l.km>0&&l.rate>0?l.rate/l.km:0;
const rateClass=v=>!v?'m':v>=set().targetRate?'g':v>=set().minRate?'m':'b';
const clientOf=id=>state.clients.find(c=>c.id===id);
const clientName=l=>(clientOf(l.clientId)||{}).name||'Без заказчика';
const route=l=>(l.from||'?')+' → '+(l.to||'?');
const revDate=l=>parseYmd(l.unloadDate)||(l.stageAt?new Date(l.stageAt):null);
const isRevenue=l=>l.stage==='done'||l.stage==='paid';
const overdue=l=>l.stage==='done'&&l.payDue&&parseYmd(l.payDue)<today();
const initials=s=>(s||'?').replace(/^(ООО|ИП|АО|ЗАО|ОАО|ПАО)\s+/i,'').replace(/[«»"]/g,'').trim().slice(0,1).toUpperCase()||'?';

/* =============== storage & sync =============== */
const API=String(window.MOYDEN_API||'').replace(/\/$/,'');
const LS='crm_data_v1';
let cloud=false,key=lsGet('crm_key',''),outbox=lsGet('crm_outbox',{}),lastSync=lsGet('crm_since',0),syncing=false,syncAgain=false,syncTimer=null,syncOk=0,syncErr=null;
const ALPH='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const normKey=k=>String(k||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const fmtKey=k=>normKey(k).replace(/(.{4})(?=.)/g,'$1-');
function genKey(){const a=crypto.getRandomValues(new Uint8Array(20));let s='';for(const x of a)s+=ALPH[x%32];return fmtKey(s)}
function saveLocal(){lsSet(LS,{loads:state.loads,clients:state.clients,settings:state.settings})}
function queue(kind,id,data,deleted){if(!cloud)return;outbox[kind+'/'+id]={kind,id,data:deleted?null:data,deleted:!!deleted,updated:Date.now()};lsSet('crm_outbox',outbox);clearTimeout(syncTimer);syncTimer=setTimeout(sync,400)}
const strip=o=>{const c=Object.assign({},o);delete c.id;return c};
function put(kind,row){const list=state[kind];const i=list.findIndex(x=>x.id===row.id);if(i>=0)list[i]=row;else list.push(row);saveLocal();queue(kind,row.id,strip(row));renderAll()}
function patch(kind,id,p){const r=state[kind].find(x=>x.id===id);if(!r)return;Object.assign(r,p);saveLocal();queue(kind,id,strip(r));renderAll()}
function del(kind,id){state[kind]=state[kind].filter(x=>x.id!==id);saveLocal();queue(kind,id,null,true);renderAll()}
function saveSettings(){saveLocal();queue('prefs','crm_settings',state.settings);renderAll()}
async function sync(){
  if(!cloud)return;if(syncing){syncAgain=true;return}syncing=true;
  const sent=Object.assign({},outbox);
  try{
    const r=await fetch(API+'/api/sync',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+normKey(key)},body:JSON.stringify({since:lastSync,changes:Object.values(sent)})});
    if(!r.ok)throw new Error('ошибка сервера '+r.status);
    const res=await r.json();
    for(const k in sent)if(outbox[k]&&outbox[k].updated===sent[k].updated)delete outbox[k];
    lsSet('crm_outbox',outbox);
    let changed=false;
    for(const d of res.docs||[]){
      if(outbox[d.kind+'/'+d.id])continue;
      if(d.kind==='prefs'){if(d.id==='crm_settings'&&d.data&&JSON.stringify(d.data)!==JSON.stringify(state.settings)){state.settings=Object.assign({},DEF_SET,d.data);changed=true}continue}
      if(d.kind!=='loads'&&d.kind!=='clients')continue;
      const list=state[d.kind];const i=list.findIndex(x=>x.id===d.id);
      if(d.deleted){if(i>=0){list.splice(i,1);changed=true}}
      else{const row=Object.assign({id:d.id},d.data);if(i<0||JSON.stringify(list[i])!==JSON.stringify(row)){if(i>=0)list[i]=row;else list.push(row);changed=true}}
    }
    lastSync=res.now;lsSet('crm_since',lastSync);if(changed){saveLocal();renderAll()}
    syncOk=Date.now();syncErr=null;
  }catch(e){syncErr=(e&&e.message)||'нет связи'}
  syncing=false;if(view==='settings')renderSettings();
  if(syncAgain||(Object.keys(outbox).length&&!syncErr)){syncAgain=false;clearTimeout(syncTimer);syncTimer=setTimeout(sync,1500)}
}
function queueAll(){for(const k of ['loads','clients'])for(const r of state[k])queue(k,r.id,strip(r));queue('prefs','crm_settings',state.settings)}

/* =============== toast =============== */
let tT=null,undoFn=null;
function toast(msg,undo){$('#toastText').textContent=msg;undoFn=undo||null;$('#toastBtn').hidden=!undo;$('#toast').hidden=false;clearTimeout(tT);tT=setTimeout(()=>{$('#toast').hidden=true;undoFn=null},undo?5000:2800)}
$('#toastBtn').addEventListener('click',()=>{if(undoFn)undoFn();undoFn=null;$('#toast').hidden=true});

/* =============== theme =============== */
let theme=lsGet('crm_theme','auto');
function applyTheme(){const r=document.documentElement;if(theme==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',theme);const b=$('#themeBtn');b.textContent='';b.append(icon(theme==='dark'?'moon':theme==='light'?'sun':'auto'));b.setAttribute('aria-label','Тема: '+({auto:'как в системе',dark:'тёмная',light:'светлая'})[theme])}
$('#themeBtn').addEventListener('click',()=>{theme=theme==='auto'?'dark':theme==='dark'?'light':'auto';lsSet('crm_theme',theme);applyTheme();toast('Тема: '+({auto:'как в системе',dark:'тёмная',light:'светлая'})[theme]);renderAll()});

/* =============== navigation =============== */
const VIEWS=[['home','Главная'],['pipe','Воронка'],['clients','Заказчики'],['reports','Отчёты']];
let view=lsGet('crm_view','home');
function nav(v){
  view=v;lsSet('crm_view',v);
  for(const id of ['home','pipe','clients','reports','settings'])$('#v-'+id).hidden=id!==v;
  drawNav();render(v);window.scrollTo(0,0);
}
function drawNav(){
  const open=state.loads.filter(l=>ACTIVE.includes(l.stage)).length;
  for(const box of [$('#nav'),$('#tabbar')]){
    box.textContent='';const isTab=box.id==='tabbar';
    for(const [id,name] of VIEWS){
      const b=h('button',{type:'button',class:isTab?'tab':null,'aria-current':view===id?'page':null,onclick:()=>nav(id)});
      if(isTab)b.append(h('span',{class:'ic'},icon(id)),name);
      else{b.append(icon(id),name);if(id==='pipe'&&open)b.append(h('span',{class:'cnt'},open))}
      box.append(b);
    }
  }
}
$('#setBtn').addEventListener('click',()=>nav(view==='settings'?'home':'settings'));
$('#newLoad').addEventListener('click',()=>openLoad(null));

/* =============== sheet =============== */
let sheetOpen=false;
function openSheet(build){
  const s=$('#sheet');s.textContent='';s.append(h('div',{class:'grab'}));build(s);
  $('#scrim').hidden=false;s.hidden=false;requestAnimationFrame(()=>{$('#scrim').classList.add('on');s.classList.add('on')});sheetOpen=true;
}
function closeSheet(){const s=$('#sheet');$('#scrim').classList.remove('on');s.classList.remove('on');sheetOpen=false;setTimeout(()=>{if(!sheetOpen){s.hidden=true;$('#scrim').hidden=true}},250)}
$('#scrim').addEventListener('click',closeSheet);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheetOpen)closeSheet()});
const shHead=(title,sub)=>h('div',{class:'sh'},h('div',null,sub?h('div',{class:'eyebrow'},sub):null,h('h2',null,title)),h('button',{type:'button',class:'ibtn','aria-label':'Закрыть',onclick:closeSheet},icon('x')));
const fl=(label,el)=>h('label',{class:'fl'},h('span',null,label),el);

/* =============== load sheet =============== */
function openLoad(l,preset){
  const isNew=!l;const d=Object.assign({stage:'found',source:'ati',truck:''},l||{},preset||{});
  let stage=d.stage;
  openSheet(s=>{
    s.append(shHead(isNew?'Новая заявка':route(d),isNew?'Заявка':clientName(d)));
    const from=h('input',{class:'field',id:'lFrom',value:d.from||'',placeholder:'Набережные Челны',autocomplete:'off'});
    const to=h('input',{class:'field',id:'lTo',value:d.to||'',placeholder:'Москва',autocomplete:'off'});
    const cargo=h('input',{class:'field',id:'lCargo',value:d.cargo||'',placeholder:'Экскаватор 32 т, 3,4 м шир.'});
    const dl=h('datalist',{id:'clientList'},state.clients.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(c=>h('option',{value:c.name})));
    const client=h('input',{class:'field',id:'lClient',list:'clientList',value:(clientOf(d.clientId)||{}).name||'',placeholder:'Начни вводить название',autocomplete:'off'});
    const rate=h('input',{class:'field',id:'lRate',inputmode:'numeric',value:d.rate?nf.format(d.rate):'',placeholder:'120 000'});
    const km=h('input',{class:'field',id:'lKm',inputmode:'numeric',value:d.km||'',placeholder:'1 000'});
    const verdict=h('div',{class:'verdict m'});
    const num=v=>parseFloat(String(v).replace(/\s/g,'').replace(',','.'))||0;
    function upd(){const r=num(rate.value),k=num(km.value);const v=k>0&&r>0?r/k:0;const c=rateClass(v);verdict.className='verdict '+c;verdict.textContent='';
      verdict.append(h('span',null,!v?'Укажи ставку и километры':c==='g'?'Выгодно: выше цели '+set().targetRate+' ₽/км':c==='m'?'Нормально: выше минимума '+set().minRate+' ₽/км':'Ниже минимума '+set().minRate+' ₽/км'),h('b',null,v?nf.format(Math.round(v))+' ₽/км':'—'))}
    rate.addEventListener('input',()=>{const n=num(rate.value);if(n)rate.value=nf.format(n);upd()});km.addEventListener('input',upd);upd();
    const truck=h('select',{class:'field',id:'lTruck'},h('option',{value:''},'Не выбран'),Array.from({length:set().trucks},(_,i)=>h('option',{value:String(i+1)},'Трал '+(i+1))),h('option',{value:'hired'},'Привлечённый'));truck.value=d.truck||'';
    const ld=h('input',{class:'field',type:'date',id:'lLoad',value:d.loadDate||''});
    const ud=h('input',{class:'field',type:'date',id:'lUnload',value:d.unloadDate||''});
    const pd=h('input',{class:'field',type:'date',id:'lPay',value:d.payDue||''});
    const src=h('select',{class:'field',id:'lSrc'},SOURCES.map(x=>h('option',{value:x[0]},x[1])));src.value=d.source||'ati';
    const note=h('textarea',{class:'field',id:'lNote',placeholder:'Контакты на погрузке, условия, документы'},d.note||'');
    const stBox=h('div',{class:'stages',role:'group','aria-label':'Этап'});
    const drawSt=()=>{stBox.textContent='';for(const [id,n] of STAGES)stBox.append(h('button',{type:'button','aria-pressed':String(id===stage),onclick:()=>{stage=id;drawSt()}},n))};drawSt();
    s.append(h('div',{class:'form'},
      fl('Этап',stBox),
      h('div',{class:'f2'},fl('Откуда',from),fl('Куда',to)),
      fl('Заказчик',client),dl,
      fl('Груз и габариты',cargo),

      h('div',{style:'display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px'},ki,h('button',{type:'button',class:'btn',onclick:()=>{const k=normKey(ki.value);if(k.length<16){toast('Ключ слишком короткий');return}key=fmtKey(k);lsSet('crm_key',key);lastSync=0;lsSet('crm_since',0);queueAll();sync().then(()=>{renderSettings();toast(syncErr?'Ключ сохранён, загружу при связи':'Готово, данные загружены')})}},'Войти'))));
  }
  const demoN=state.loads.filter(l=>l.demo).length;
  g.append(h('div',{class:'card'},h('div',{class:'ct'},h('h3',null,'Пример')),h('p',{class:'sub',style:'margin:0 0 10px'},demoN?'Сейчас в приложении есть пример: '+demoN+' заявок. Удали его, когда начнёшь вести свои.':'Можно заполнить приложение примером, чтобы посмотреть, как всё выглядит.'),
    demoN?h('button',{type:'button',class:'btn danger',onclick:clearDemo},'Удалить пример'):h('button',{type:'button',class:'btn ghost',onclick:loadDemo},'Показать на примере')));
  box.append(g);
}
